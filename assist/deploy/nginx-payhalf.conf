# /etc/nginx/sites-available/payhalf
# payhalf.plankton.tw：台北通「陪辦」demo 後端（REST + Socket.IO + 承辦工作台網頁）
#   Cloudflare（Proxied）→ 這裡（HTTPS）→ 127.0.0.1:3210（pm2 payhalf-assist，~/payhalf）
# 憑證與 Cloudflare 真實 IP 設定沿用同一台的 plankton 網站（/etc/ssl/cloudflare/plankton-*.pem）。

map $http_upgrade $payhalf_connection {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name payhalf.plankton.tw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name payhalf.plankton.tw;

    ssl_certificate     /etc/ssl/cloudflare/plankton-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plankton-key.pem;

    include snippets/cloudflare-realip.conf;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/payhalf-access.log;
    error_log  /var/log/nginx/payhalf-error.log warn;

    gzip on;
    gzip_types text/javascript application/javascript application/json text/css image/svg+xml application/wasm;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    location / {
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3210;
    }

    # Socket.IO：WebSocket 長連線
    location /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $payhalf_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:3210;
    }
}
