<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <g id="hp-hand">
      <rect x="-15" y="-8" width="30" height="28" rx="11"/>
      <rect x="-14" y="-24" width="7" height="24" rx="3.5"/>
      <rect x="-6" y="-30" width="7" height="30" rx="3.5"/>
      <rect x="2" y="-28" width="7" height="28" rx="3.5"/>
      <rect x="10" y="-21" width="6.5" height="22" rx="3.25"/>
      <rect x="-30" y="0" width="22" height="8" rx="4" transform="rotate(-40 -10 6)"/>
    </g>
  </defs>
  <g stroke="#22474E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- hair back -->
    <path d="M54 108 C48 64 72 46 100 46 C130 46 152 64 146 108 Z" fill="#30383D"/>
    <!-- raised arm -->
    <path d="M52 198 C42 180 38 160 40 140" fill="none" stroke-width="26"/>
    <path d="M52 198 C42 180 38 160 40 140" fill="none" stroke="#FFFFFF" stroke-width="19"/>
    <!-- body: shirt -->
    <path d="M28 240 C28 188 56 162 100 162 C144 162 172 188 172 240 Z" fill="#FFFFFF"/>
    <!-- vest -->
    <path d="M44 240 C40 200 52 176 76 166 L90 200 L88 240 Z" fill="#5AB4C5"/>
    <path d="M156 240 C160 200 148 176 124 166 L110 200 L112 240 Z" fill="#5AB4C5"/>
    <path d="M58 214 L76 214 M124 214 L142 214" fill="none" stroke="#B4E2EA" stroke-width="4"/>
    <!-- neck -->
    <path d="M88 146 L88 166 Q100 174 112 166 L112 146 Z" fill="#E9B596"/>
    <!-- lanyard -->
    <path d="M88 166 L100 196 L112 166" fill="none" stroke="#E35D5D" stroke-width="4"/>
    <rect x="89" y="194" width="22" height="28" rx="4" fill="#FFFFFF"/>
    <rect x="89" y="194" width="22" height="9" rx="3" fill="#F5BA4B"/>
    <circle cx="100" cy="212" r="4" fill="#B4E2EA" stroke-width="2.5"/>
    <!-- ears -->
    <circle cx="58" cy="110" r="9" fill="#F6D2B8"/>
    <circle cx="142" cy="110" r="9" fill="#F6D2B8"/>
    <!-- face -->
    <ellipse cx="100" cy="108" rx="41" ry="40" fill="#F6D2B8"/>
    <!-- fringe -->
    <path d="M58 104 C54 70 76 56 102 56 C128 56 146 72 142 102 C136 86 124 78 112 78 C104 88 86 94 70 92 C64 96 60 100 58 104 Z" fill="#30383D"/>
    <!-- eyes -->
    <circle cx="83" cy="112" r="4.2" fill="#22474E" stroke="none"/>
    <circle cx="117" cy="112" r="4.2" fill="#22474E" stroke="none"/>
    <circle cx="84.5" cy="110.5" r="1.3" fill="#FFFFFF" stroke="none"/>
    <circle cx="118.5" cy="110.5" r="1.3" fill="#FFFFFF" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="72" cy="127" rx="7" ry="4.5" fill="#E35D5D" fill-opacity="0.35" stroke="none"/>
    <ellipse cx="128" cy="127" rx="7" ry="4.5" fill="#E35D5D" fill-opacity="0.35" stroke="none"/>
    <!-- open smile -->
    <path d="M90 124 Q100 140 110 124 Z" fill="#FFFFFF" stroke-width="3"/>
    <g transform="translate(40 116) rotate(-8)">
      <use href="#hp-hand" fill="#22474E" stroke-width="7"/>
      <use href="#hp-hand" fill="#F6D2B8" stroke="none"/>
    </g>
    <!-- sparkle -->
    <path d="M16 72 L16 84 M10 78 L22 78" fill="none" stroke="#F5BA4B" stroke-width="3"/>
  </g>
</svg>
