      <g fill="#356C77" stroke="none"><rect x="158" y="80" width="7" height="7" rx="1"/><rect x="169" y="80" width="7" height="7" rx="1"/><rect x="158" y="102" width="7" height="7" rx="1"/><rect x="169" y="104" width="4" height="4"/></g>
