    <circle cx="82" cy="110" r="3.6" fill="#22474E" stroke="none"/>
    <circle cx="118" cy="110" r="3.6" fill="#22474E" stroke="none"/>
    <!-- cheeks -->
    <ellipse cx="72" cy="128" rx="7" ry="4.5" fill="#E35D5D" fill-opacity="0.35" stroke="none"/>
    <ellipse cx="128" cy="128" rx="7" ry="4.5" fill="#E35D5D" fill-opacity="0.35" stroke="none"/>
