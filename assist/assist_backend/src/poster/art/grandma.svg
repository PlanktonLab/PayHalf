    <circle cx="57" cy="108" r="9" fill="#F6D2B8"/>
    <circle cx="143" cy="108" r="9" fill="#F6D2B8"/>
    <circle cx="57" cy="120" r="3" fill="#F5BA4B" stroke-width="2"/>
    <circle cx="143" cy="120" r="3" fill="#F5BA4B" stroke-width="2"/>
