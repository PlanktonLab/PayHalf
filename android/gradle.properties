org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# QR 掃描改用「bundled」ML Kit 模型(打包進 App),不依賴 Google Play 服務下載;
# 沒有 Play 服務的裝置與模擬器,也能辨識 QR。代價是 App 約增加數 MB。
dev.steenbakker.mobile_scanner.useUnbundled=false
# 以下兩個 flag 對齊 Flutter 3.47.1 的 app template
android.newDsl=false
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 仍使用 proguard-android.txt，AGP 9 預設拒絕。
# 等 plugin 推出支援 AGP 9 的穩定版後移除這行
android.r8.proguardAndroidTxt.disallowed=false
