<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台北通表單 承辦人後台</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7; --panel:#ffffff; --ink:#1d1d1f; --muted:#5f6368; --line:#d2d2d7; --line2:#e8e8ed;
  --brand:#0a6ed1; --brand-d:#0858ab; --brand-l:rgba(10,110,209,.09); --brand-m:rgba(10,110,209,.22);
  --warn:#8a5200; --warn-l:#fff4df; --danger:#c5221f; --danger-l:#fdecea; --ok:#168a46; --ok-l:#e3f6ea;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--font);letter-spacing:.01em;-webkit-font-smoothing:antialiased}
a{color:var(--brand-d);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
h2,h3{margin:0}
/* 頂欄 */
header.top{background:rgba(251,251,253,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;gap:14px;padding:0 24px;height:60px;position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--ink);background:none;border:0;padding:0}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}
.sp{flex:1}
.who{font-size:14px;color:var(--muted)}
@media (max-width:760px){.who{display:none}}
main{padding:28px 24px 90px;max-width:1180px;margin:0 auto}
/* 按鈕 */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 18px;min-height:44px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--brand-l);border-color:var(--brand-m)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-l);border-color:var(--danger-l)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px}
.btn.icon{padding:0;width:44px;justify-content:center}
.btn.sm.icon{width:36px}
.btn.lg{min-height:54px;padding:0 28px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.tag.draft{background:#e8ecee;color:#3f4a50}.tag.open{background:var(--ok-l);color:#0f6a37}.tag.closed{background:var(--danger-l);color:#a3211d}
/* 首頁 */
.hero{padding:30px 32px;margin-bottom:26px;background:linear-gradient(135deg,#eaf3fd,#fff 70%);position:relative}
.hero h2{font-size:28px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:6px 0 20px;color:var(--muted)}
.hero .x{position:absolute;right:14px;top:14px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3>div{background:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.steps3 .n{width:44px;height:44px;border-radius:14px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;flex:none}
.steps3 b{display:block}
.homehead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.homehead h2{font-size:26px;font-weight:800}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:0;background:transparent;border-radius:99px;padding:6px 16px;font-weight:700;color:var(--muted);min-height:38px}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff}
.fitem{padding:20px 24px;margin-bottom:12px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fitem .ico{width:52px;height:52px;border-radius:16px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;flex:none}
.fitem .info{flex:1;min-width:220px}
.fitem .nm{font-size:19px;font-weight:800;line-height:1.35;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.fitem .nm:hover{color:var(--brand-d)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14.5px;margin-top:4px;align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:68px;height:68px;border-radius:22px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;margin:0 auto 14px}
/* 步驟列 */
.stepper{display:flex;align-items:center;gap:0;margin:0 auto 26px;max-width:760px}
.stepper button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;color:var(--muted);font-weight:700;text-align:left}
.stepper .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);font-weight:800;flex:none}
.stepper .on{color:var(--ink)}.stepper .on .c{background:var(--brand);border-color:var(--brand);color:#fff}
.stepper .done .c{background:var(--ok);border-color:var(--ok);color:#fff}.stepper .done{color:var(--ink)}
.stepper .ln{flex:1;height:2px;background:var(--line);margin:0 8px;min-width:16px}
.stepper small{display:block;font-weight:500;color:var(--muted);font-size:13px}
@media (max-width:640px){.stepper small{display:none}.stepper button span.t{display:none}.stepper .on span.t{display:inline}}
.panel{padding:26px 30px;margin-bottom:16px}
.panel h3{font-size:22px;font-weight:800;margin-bottom:4px}
.panel .lead{color:var(--muted);margin:0 0 18px}
.fld label.lb,label.lb{display:block;font-weight:700;margin:16px 0 6px}
.lb small{font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=tel],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;min-height:48px}
input:focus,textarea:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-l)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.hint-t{font-size:14.5px;color:var(--muted);margin-top:5px}
/* 開關 */
.switch{display:flex;gap:14px;align-items:flex-start;cursor:pointer;padding:14px 16px;border-radius:16px;background:var(--bg);margin-top:16px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:52px;height:30px;border-radius:99px;background:#b9bec3;position:relative;flex:none;transition:.2s;margin-top:2px}
.switch .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.sw{background:var(--brand)}
.switch input:checked+.sw::after{left:25px}
.switch input:focus-visible+.sw{outline:3px solid var(--brand);outline-offset:2px}
.switch b{display:block}
.switch.compact{padding:0;background:none;margin-top:14px;align-items:center}
/* 題目編輯 */
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media (max-width:1020px){.two{grid-template-columns:1fr}}
.sticky{position:sticky;top:78px}
.qcard{background:var(--panel);border-radius:20px;margin-bottom:12px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.qcard.sel{border-color:var(--brand);box-shadow:0 6px 24px rgba(10,110,209,.12)}
.qcard.dragover{outline:3px dashed var(--brand)}
.qh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-radius:18px}
.qh:hover{background:var(--brand-l)}
.qh .grip{color:#9aa0a6;cursor:grab}
.qh .num{width:34px;height:34px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800;flex:none}
.qh .qtt{flex:1;min-width:0}
.qh .qt{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis}
.qh .qm{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.warnchip{display:inline-flex;gap:4px;align-items:center;background:var(--warn-l);color:var(--warn);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.qed{padding:4px 20px 20px 62px}
@media (max-width:640px){.qed{padding-left:20px}}
.optr{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.warn{background:var(--warn-l);color:var(--warn);border-radius:14px;padding:10px 14px;margin-top:14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.warn+.warn{margin-top:8px}
.good{display:flex;gap:8px;align-items:center;color:var(--ok);margin-top:14px;font-weight:600;font-size:15px}
.qtool{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.addbig{width:100%;min-height:68px;border:2px dashed var(--brand-m);background:var(--brand-l);color:var(--brand-d);border-radius:20px;font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;justify-content:center}
.addbig:hover{background:var(--brand-m)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}
.chipbtn{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;min-height:40px}
.chipbtn:hover{border-color:var(--brand);background:var(--brand-l)}
/* 題型選擇 */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:8px 0 18px}
.picker button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line2);background:#fff;border-radius:16px;padding:12px 14px}
.picker button:hover{border-color:var(--brand);background:var(--brand-l)}
.picker .pi{width:40px;height:40px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;flex:none}
.picker b{display:block;line-height:1.3}
.picker span.d{font-size:13.5px;color:var(--muted);line-height:1.4;display:block}
/* 手機預覽 */
.pvlabel{font-weight:800;margin:0 0 10px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.phone{width:100%;max-width:370px;margin:0 auto;border:9px solid #1f2a33;border-radius:36px;background:#fff;color:#14201f;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .bar{background:var(--brand);color:#fff;padding:14px 16px;font-weight:800}
.phone .body{padding:18px;min-height:360px;display:flex;flex-direction:column;gap:14px}
.phone.tall .body{min-height:520px}
.prog{height:8px;background:#dfe8f2;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.qtx{font-weight:800;line-height:1.4}
.phint{background:#e8f1fb;border-radius:12px;padding:10px 12px;color:#0d3d70;display:flex;gap:8px;align-items:flex-start}
.phone input[type=text],.phone input[type=date],.phone input[type=tel],.phone input[type=number],.phone textarea,.phone select{border:2px solid #9bb3cc;font-size:1em;padding:12px;border-radius:12px}
.choice{display:flex;gap:12px;align-items:center;border:2px solid #9bb3cc;border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;font-size:1em}
.choice input{width:26px;height:26px;flex:none}
.pnav{margin-top:auto;display:flex;gap:10px}
.pnav button{flex:1;min-height:56px;border-radius:14px;border:2px solid var(--brand);font-weight:800;font-size:1em;background:#fff;color:var(--brand-d)}
.pnav button.p{background:var(--brand);color:#fff}
.pnav button:disabled{opacity:.4}
.speak{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:2px solid var(--brand);border-radius:99px;background:#fff;color:var(--brand-d);padding:6px 16px;font-weight:800;font-size:.8em}
.seg{display:inline-flex}
.seg button{border:1.5px solid var(--line);background:#fff;padding:0 18px;min-height:42px;font-weight:700;margin-right:-1.5px}
.seg button:first-child{border-radius:99px 0 0 99px}.seg button:last-child{border-radius:0 99px 99px 0;margin-right:0}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.check:last-child{border:0}
.check .ci{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ci.ok{background:var(--ok-l);color:var(--ok)}.ci.bad{background:var(--danger-l);color:var(--danger)}.ci.warn{background:var(--warn-l);color:var(--warn)}
.footnav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,251,253,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line2);padding:12px 24px;display:flex;gap:12px;justify-content:center;z-index:25}
.footnav .in{width:100%;max-width:1180px;display:flex;gap:12px;align-items:center}
.saved{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-size:14.5px;font-weight:600}
/* 回覆 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:18px 20px}.stat b{font-size:30px;display:block;line-height:1.2}
.tablewrap{overflow:auto;max-height:60vh}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:15.5px}
th{color:var(--muted);background:#fff;position:sticky;top:0;font-size:14px;white-space:nowrap}
/* 彈窗與提示 */
dialog{border:0;border-radius:24px;background:#fff;color:var(--ink);max-width:720px;width:94%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{font-size:22px;font-weight:800;margin-bottom:6px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2a33;color:#fff;padding:10px 12px 10px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:#fff;color:#1f2a33;border:0;border-radius:99px;padding:4px 16px;font-weight:800;min-height:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div id="foot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

function newField(type,label,hint){

  const L={text:'請輸入',textarea:'請說明狀況',date:'請選擇日期',number:'請輸入數字',phone:'你的聯絡電話',idno:'你的身分證字號',address:'你住在哪裡',file:'請上傳照片或檔案',consent:'我已經看過並同意上述內容',radio:'請選擇一個',checkbox:'請選擇(可以選很多個)',select:'請選擇'};
  if(!f.label)f.label=L[type];
  if(['radio','checkbox','select'].includes(type))f.options=['選項一','選項二'];

}

/* ===== 狀態 ===== */
let S=load()||seed();
function seed(){
  const a=TEMPLATES.elder.make(),b=TEMPLATES.repair.make();
  return {forms:[{id:uid(),...a,deadline:'2026-12-31',allowAssist:true,status:'open',updated:Date.now()-86400000*2},{id:uid(),...b,deadline:'',allowAssist:false,status:'draft',updated:Date.now()-3600000*5}],
    cur:null,view:'home',step:1,sel:null,pv:0,pvSize:'l',hideWelcome:false,filter:'all'};
}
function load(){try{const s=JSON.parse(localStorage.getItem('tpf-admin-v2'));if(s){s.view='home';s.cur=null;}return s}catch(e){return null}}
function save(){try{localStorage.setItem('tpf-admin-v2',JSON.stringify(S))}catch(e){}}
const form=()=>S.forms.find(f=>f.id===S.cur);
function touch(){const f=form();if(f)f.updated=Date.now();save();const e=$('#saved');if(e){e.style.opacity=1}}
let tt;function toast(m,label,fn){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${label?`<button id="tact">${esc(label)}</button>`:''}`;t.classList.add('show');if(label)$('#tact').onclick=()=>{fn();t.classList.remove('show')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),label?6000:2600);}
const fmt=ts=>new Date(ts).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const stName={draft:'草稿',open:'收件中',closed:'已結束'};
const stIc={draft:'pencil',open:'circle-check',closed:'lock'};

/* ===== 好懂檢查 ===== */
function readability(f){
  const w=[],t=f.label||'';
  if(t.length>20)w.push({msg:'問題有點長(超過 20 個字),長輩可能看不完。可以縮短,或拆成兩題。'});
  for(const k in JARGON){if(t.includes(k)){const to=JARGON[k];w.push({msg:`「${k}」是公文用語,建議改成日常說法${to?`,例如「${to}」`:''}。`,fix:to?{k,to}:null});}}
  if(/[A-Za-z]{3,}/.test(t)&&f.type!=='idno')w.push({msg:'盡量不要用英文縮寫,長輩看不懂。'});
  if(['idno','address','file','date'].includes(f.type)&&!f.hint)w.push({msg:'建議在「給民眾的提示」寫一句話,說明要填什麼、去哪裡找。'});
  if(['radio','checkbox','select'].includes(f.type)&&f.options.length>6)w.push({msg:'選項超過 6 個,不容易選。可以精簡一下。'});
  return w;
}
const warnCount=f=>f.fields.filter(x=>readability(x).length).length;

    <button class="btn sm" data-act="help">${ic('circle-help',18)}使用說明</button>`;
}
function render(){
  renderTop();
  $('#app').innerHTML={home:vHome,edit:vEdit,resp:vResp}[S.view]();
  $('#foot').innerHTML=S.view==='edit'?footNav():'';
  save();
}

      <button class="btn icon danger" data-act="del" data-id="${f.id}" title="刪除這份表單" aria-label="刪除這份表單">${ic('trash-2',18)}</button></div></div>`).join('');
  return `${hero}<div class="homehead"><h2>我的表單</h2><span class="sp"></span><button class="btn primary lg" data-act="new">${ic('plus',22)}建立新表單</button></div>
   <div class="filters" role="group" aria-label="篩選">${[['all','全部'],['open','收件中'],['draft','草稿'],['closed','已結束']].map(([k,n])=>`<button data-act="filter" data-k="${k}" aria-pressed="${S.filter===k}">${n}(${cnt(k)})</button>`).join('')}</div>
   ${items||`<div class="card empty"><div class="ico">${ic('file-text',34)}</div><b>${S.forms.length?'這個分類目前沒有表單':'還沒有任何表單'}</b><p>按右上角的「建立新表單」開始吧。</p></div>`}`;
}

/* ===== 編輯 ===== */
function stepper(){
  const t=[['1','寫基本資料','表單名稱與說明'],['2','加入題目','想問民眾什麼'],['3','預覽並發布','確認後送出']];
  return `<nav class="stepper" aria-label="步驟">${t.map(([n,a,b],i)=>{
    const k=i+1,cls=S.step===k?'on':S.step>k?'done':'';
    return `${i?'<span class="ln"></span>':''}<button class="${cls}" data-act="step" data-k="${k}" ${S.step===k?'aria-current="step"':''}><span class="c">${S.step>k?ic('check',20):n}</span><span class="t"><span>${a}</span><small>${b}</small></span></button>`}).join('')}</nav>`;
}
function vEdit(){
  const f=form();
  const banner=f.status==='open'?`<div class="warn" style="background:var(--ok-l);color:#0f6a37;margin:0 0 16px">${ic('info',20)}<span>這份表單已經發布。你修改的內容,民眾會立刻看到。</span></div>`:'';
  return `${stepper()}${banner}${[null,step1,step2,step3][S.step](f)}`;
}
function step1(f){

function typePicker(){

function warnHTML(x){

/* 手機題目畫面 */
let ans={};
function qBody(x,i,n,live){
  return `${i===0&&form().desc&&live?`<div class="phint">${ic('info',20)}<span>${esc(form().desc)}</span></div>`:''}
   <div class="prog"><i style="width:${(i+1)/n*100}%"></i></div>
   <div style="color:#4c5f6d;font-size:.8em">第 ${i+1} 題,共 ${n} 題</div>
   <div class="qtx" style="font-size:1.2em">${esc(x.label)}${x.required?'':' <span style="font-weight:500;font-size:.65em;color:#4c5f6d">(可以不填)</span>'}</div>
   ${x.hint?`<div class="phint">${ic('lightbulb',20)}<span>${esc(x.hint)}</span></div>`:''}
   <button class="speak" ${live?'data-act="speak"':''}>${ic('volume-2',20)}念給我聽</button>
   <div>${pvInput(x)}</div>`;
}
function pvInput(x){
  const v=ans[x.id],o=x.options||[];
  switch(x.type){
    case 'radio':return o.map(t=>`<label class="choice"><input type="radio" name="pv" value="${esc(t)}" ${v===t?'checked':''}>${esc(t)}</label>`).join('');
    case 'checkbox':return o.map(t=>`<label class="choice"><input type="checkbox" name="pv" value="${esc(t)}" ${(v||[]).includes(t)?'checked':''}>${esc(t)}</label>`).join('');
    case 'select':return `<select id="pvin"><option value="">請選擇</option>${o.map(t=>`<option ${v===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
    case 'textarea':return `<textarea id="pvin" rows="4">${esc(v||'')}</textarea>`;
    case 'consent':return `<label class="choice"><input type="checkbox" id="pvin" ${v?'checked':''}>${esc(x.label)}</label>`;
    case 'file':return `<input type="file" id="pvin">`;
    case 'date':return `<input type="date" id="pvin" value="${esc(v||'')}">`;
    case 'number':return `<input type="number" inputmode="numeric" id="pvin" value="${esc(v||'')}">`;
    case 'phone':return `<input type="tel" inputmode="tel" id="pvin" value="${esc(v||'')}" placeholder="0912-345-678">`;
    case 'idno':return `<input type="text" id="pvin" maxlength="10" value="${esc(v||'')}" placeholder="A123456789" autocapitalize="characters">`;
    default:return `<input type="text" id="pvin" value="${esc(v||'')}">`;
  }
}
const SIZES={m:'18px',l:'22px',xl:'28px'};
function summary(x,v){
  if(x.type==='idno'&&v)return v.slice(0,3)+'●●●●'+v.slice(-3);
  if(Array.isArray(v))return v.join('、')||'(沒有填)';
  if(x.type==='consent')return v?'已同意':'(沒有勾選)';
  return v||'(沒有填)';
}
function step3(f){
  const n=f.fields.length,sz=SIZES[S.pvSize];
  const wc=warnCount(f);
  const checks=[
    f.title.trim()?['ok','有表單名稱','']:['bad','還沒有表單名稱','回到第 1 步填寫'],
    n?['ok',`已加入 ${n} 題`,'']:['bad','還沒有任何題目','回到第 2 步加入'],
    wc?['warn',`有 ${wc} 題可以更好懂`,'不影響發布,但建議回第 2 步看看提示']:['ok','所有題目長輩都看得懂',''],
    f.deadline?['ok',`截止日:${f.deadline}`,'']:['warn','沒有設定截止日','會一直收件,直到你按「結束收件」'],
    f.allowAssist?['ok','開放協助辦理','家人、里長、看護、1999 客服可代填']:['warn','未開放協助辦理','長輩只能自己填寫']
  ];
  const icn={ok:'circle-check',bad:'x',warn:'triangle-alert'};
  let body;
  if(!n)body=`<div class="phone tall"><div class="bar">${esc(f.title)}</div><div class="body"><div class="phint">${ic('info',20)}還沒有題目可以預覽。</div></div></div>`;
  else if(S.pv>=n)body=`<div class="phone tall"><div class="bar">${esc(f.title)}</div><div class="body" style="font-size:${sz}"><div class="qtx" style="font-size:1.25em">請最後確認</div>
     ${f.fields.map(x=>`<div class="phint" style="display:block"><b>${esc(x.label)}</b><br>${esc(summary(x,ans[x.id]))}</div>`).join('')}
     <div class="pnav"><button data-act="pvprev">回上一題</button><button class="p" data-act="pvsubmit">確認送出</button></div></div></div>`;
  else body=`<div class="phone tall"><div class="bar">${esc(f.title)}</div><div class="body" style="font-size:${sz}">${qBody(f.fields[S.pv],S.pv,n,true)}
     <div class="pnav"><button data-act="pvprev" ${S.pv===0?'disabled':''}>回上一題</button><button class="p" data-act="pvnext">下一題</button></div></div></div>`;
  return `<div class="two" style="grid-template-columns:minmax(0,1fr) 400px">
    <section><div class="card panel"><h3>發布前檢查</h3><p class="lead">看看有沒有漏掉的地方。</p>
      ${checks.map(([s,a,b])=>`<div class="check"><span class="ci ${s}">${ic(icn[s],18)}</span><span><b>${a}</b>${b?`<div class="muted small">${b}</div>`:''}</span></div>`).join('')}</div>
     <div class="card panel"><h3>試試看民眾怎麼填</h3><p class="lead">右邊是手機畫面,可以實際填填看(不會真的送出)。</p>
       <b>字體大小</b><div style="margin:8px 0 16px"><div class="seg" role="group" aria-label="字體大小">${[['m','中'],['l','大'],['xl','特大']].map(([k,t])=>`<button data-act="size" data-k="${k}" aria-pressed="${S.pvSize===k}">${t}</button>`).join('')}</div></div>
       <button class="btn" data-act="pvreset">${ic('rotate-ccw',18)}重新開始試填</button></div></section>
    <aside class="sticky"><div class="pvlabel">${ic('eye',20)}手機畫面</div>${body}</aside></div>`;
}
function footNav(){
  const f=form(),k=S.step;
  return `<div class="footnav"><div class="in">
    <span class="saved" id="saved">${ic('circle-check',18)}修改會自動儲存</span><span class="sp"></span>
    ${k>1?`<button class="btn lg" data-act="step" data-k="${k-1}">${ic('arrow-left',20)}上一步</button>`:''}
    ${k<3?`<button class="btn primary lg" data-act="step" data-k="${k+1}">下一步:${k===1?'加入題目':'預覽並發布'}${ic('chevron-right',20)}</button>`
     :f.status==='open'?`<button class="btn lg" data-act="close">${ic('lock',20)}結束收件</button>`

/* ===== 回覆資料(示意) ===== */
function respCount(f){return allResp(f).length}
function rng(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function mockResp(f){
  if(f.status==='draft')return [];
  const r=rng(f.id),names=['陳美玲','林建國','黃秀英','張志明','李淑芬','王大明','吳金龍','蔡玉蘭'],by=['本人','家屬協助','里長協助','看護協助','1999 客服協助'];
  const out=[];
  for(let i=0;i<(f.status==='closed'?6:8);i++){
    const row={_t:Date.now()-Math.floor(r()*86400000*6),_by:by[Math.floor(r()*by.length)]};
    f.fields.forEach(x=>{const o=x.options||[];
      if(x.type==='idno')row[x.id]='A'+(Math.floor(r()*2)+1)+String(Math.floor(r()*1e8)).padStart(8,'0');
      else if(x.type==='phone')row[x.id]='09'+String(Math.floor(r()*1e8)).padStart(8,'0');
      else if(x.type==='radio'||x.type==='select')row[x.id]=o[Math.floor(r()*o.length)]||'';
      else if(x.type==='checkbox')row[x.id]=o.slice(0,1+Math.floor(r()*o.length)).join('、');
      else if(x.type==='date')row[x.id]='19'+(30+Math.floor(r()*30))+'-0'+(1+Math.floor(r()*9))+'-1'+Math.floor(r()*9);
      else if(x.type==='consent')row[x.id]='已同意';
      else if(x.type==='file')row[x.id]='照片'+(i+1)+'.jpg';
      else if(x.type==='address')row[x.id]='臺北市'+['大安','信義','中正','萬華','北投'][Math.floor(r()*5)]+'區○○路'+Math.floor(r()*200)+'號';
      else if(x.type==='number')row[x.id]=Math.floor(r()*10);
      else if(x.label.includes('姓名'))row[x.id]=names[Math.floor(r()*names.length)];
      else row[x.id]='(示意回答)';});
    out.push(row);
  }
  return out;
}
const allResp=f=>[...(f.live||[]),...mockResp(f)].sort((a,b)=>b._t-a._t);
const maskVal=(x,v)=>x.type==='idno'&&v?String(v).slice(0,3)+'●●●●'+String(v).slice(-3):x.type==='phone'&&v?String(v).slice(0,4)+'●●●'+String(v).slice(-3):v;
function vResp(){
  const f=form(),rs=allResp(f),assist=rs.filter(r=>r._by!=='本人'&&!r._by.startsWith('本人')).length;
  return `<div class="homehead"><button class="btn" data-act="edit" data-id="${f.id}">${ic('arrow-left',18)}回編輯表單</button><h2>民眾填寫的回覆</h2><span class="sp"></span>
    <button class="btn primary" data-act="csv" ${rs.length?'':'disabled'}>${ic('download',18)}下載成 Excel 檔(CSV)</button></div>
   <div class="stats"><div class="card stat"><span class="muted">全部回覆</span><b>${rs.length}</b></div><div class="card stat"><span class="muted">別人協助填寫</span><b>${assist}</b></div><div class="card stat"><span class="muted">本人填寫</span><b>${rs.length-assist}</b></div></div>
   <div class="warn" style="margin:0 0 14px">${ic('lock',20)}<span>目前是示意資料。身分證字號和電話在畫面上會遮住一部分,下載檔案時請妥善保管,避免個資外洩。</span></div>
   <div class="card tablewrap">${rs.length?`<table><thead><tr><th>送出時間</th><th>誰填的</th>${f.fields.map(x=>`<th>${esc(x.label)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr><td>${fmt(r._t)}</td><td>${esc(r._by)}</td>${f.fields.map(x=>`<td>${esc(maskVal(x,r[x.id])??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`:`<div class="empty"><div class="ico">${ic('inbox',34)}</div><b>還沒有人填寫</b><p>表單發布後,民眾的回覆會顯示在這裡。</p></div>`}</div>`;
}

/* ===== 彈窗 ===== */
function dlg(html,onclose){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal();}
function closeDlg(){const d=$('#dlg');if(d.open)d.close();}
function helpDlg(){dlg(`<h3>怎麼使用?</h3><p class="muted" style="margin-top:0">做一份表單只要 3 步,每一步都有「下一步」按鈕帶你走。</p>
  <div class="steps3" style="grid-template-columns:1fr;margin:14px 0">
   <div style="background:var(--bg)"><span class="n">${ic('file-text',24)}</span><span><b>1. 寫基本資料</b><span class="muted small">填表單名稱、單位和開頭說明。</span></span></div>
   <div style="background:var(--bg)"><span class="n">${ic('square-pen',24)}</span><span><b>2. 加入題目</b><span class="muted small">按「新增題目」,選一種題型。右邊會即時顯示民眾在手機上看到的樣子。</span></span></div>
   <div style="background:var(--bg)"><span class="n">${ic('send',24)}</span><span><b>3. 預覽並發布</b><span class="muted small">先試填一次,沒問題再按「發布表單」。</span></span></div></div>
  <div class="warn" style="background:var(--brand-l);color:var(--brand-d)">${ic('lightbulb',20)}<span>小技巧:題目用日常說話的方式寫(「你住在哪裡」,而不是「戶籍所在地」),長輩會比較容易看懂。系統會幫你檢查。</span></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" data-act="closedlg">我知道了</button></div>`);}
function newDlg(){dlg(`<h3>要建立哪一種表單?</h3><p class="muted" style="margin:4px 0 12px">可以從範本開始,再改成你要的內容。</p>
  <div class="picker" style="grid-template-columns:1fr">${Object.entries(TEMPLATES).map(([k,v])=>`<button data-act="tpl" data-k="${k}"><span class="pi">${ic(v.ic,22)}</span><span><b>${v.n}</b><span class="d">${v.d}</span></span></button>`).join('')}</div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closedlg">取消</button></div>`);}

/* ===== 驗證 / 朗讀 ===== */
function pvCollect(){
  const x=form().fields[S.pv];if(!x)return null;
  if(x.type==='radio'){const c=document.querySelector('input[name=pv]:checked');return c?c.value:''}
  if(x.type==='checkbox')return [...document.querySelectorAll('input[name=pv]:checked')].map(i=>i.value);
  if(x.type==='consent')return $('#pvin').checked;
  if(x.type==='file'){const i=$('#pvin');return i.files[0]?i.files[0].name:''}
  return $('#pvin').value.trim();
}
function validate(x,v){
  const empty=v===''||v===false||(Array.isArray(v)&&!v.length);
  if(empty)return x.required?'這題要填喔,請回答後再按「下一題」':'';
  if(x.type==='idno'&&!/^[A-Z][12489]\d{8}$/.test(v.toUpperCase()))return '身分證字號格式不對,應該是 1 個英文字母加 9 個數字';
  if(x.type==='phone'&&!/^(09\d{2}-?\d{3}-?\d{3}|0\d{1,2}-?\d{6,8})$/.test(v.replace(/\s/g,'')))return '電話號碼格式不對,請再檢查一次';
  return '';
}
function speak(t){if(!('speechSynthesis' in window)){toast('這個裝置不支援朗讀');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u)}

/* ===== 操作 ===== */
const go=(v,extra={})=>{closeDlg();Object.assign(S,{view:v},extra);render();window.scrollTo(0,0)};
let removed=null;
function addQ(x){const f=form();const i=f.fields.findIndex(a=>a.id===S.sel);f.fields.splice(i>=0?i+1:f.fields.length,0,x);S.sel=x.id;touch();closeDlg();render();
  setTimeout(()=>{const e=$('#q-label');if(e){e.focus();e.select();e.scrollIntoView({block:'center',behavior:'smooth'})}},60);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const d=t.dataset,a=d.act,f=S.cur?form():null;
  if(a==='home')return go('home',{cur:null});
  if(a==='help')return helpDlg();
  if(a==='closedlg')return closeDlg();
  if(a==='hidewelcome'){S.hideWelcome=true;return render()}
  if(a==='filter'){S.filter=d.k;return render()}
  if(a==='new')return newDlg();
  if(a==='tpl'){const m=TEMPLATES[d.k].make(),nf={id:uid(),...m,deadline:'',allowAssist:true,status:'draft',updated:Date.now()};S.forms.unshift(nf);closeDlg();go('edit',{cur:nf.id,step:1,sel:null,pv:0});ans={};return}
  if(a==='edit'){ans={};return go('edit',{cur:d.id,step:1,sel:null,pv:0})}
  if(a==='resp')return go('resp',{cur:d.id});
  if(a==='dup'){const o=S.forms.find(x=>x.id===d.id),c=JSON.parse(JSON.stringify(o));c.id=uid();c.title+='(複本)';c.status='draft';c.live=[];c.updated=Date.now();c.fields.forEach(x=>x.id=uid());S.forms.unshift(c);render();return toast('已複製,放在列表最上面')}
  if(a==='del'){const o=S.forms.find(x=>x.id===d.id);return dlg(`<h3>要刪除這份表單嗎?</h3><p><b>${esc(o.title||'未命名表單')}</b>${respCount(o)?`<br>裡面已經有 ${respCount(o)} 份民眾回覆,一起刪除後<b>無法復原</b>。`:'<br>刪除後無法復原。'}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closedlg">不要刪除</button><button class="btn primary danger" style="background:var(--danger);color:#fff;border-color:var(--danger)" data-act="delok" data-id="${o.id}">${ic('trash-2',18)}確定刪除</button></div>`)}
  if(a==='delok'){S.forms=S.forms.filter(x=>x.id!==d.id);closeDlg();render();return toast('已刪除')}
  if(a==='step'){const k=Number(d.k);if(S.step===3){S.pv=0;ans={}}S.step=k;S.sel=k===2&&f.fields.length?S.sel:null;render();return window.scrollTo(0,0)}
  if(a==='addpick')return dlg(typePicker());
  if(a==='addtype')return addQ(newField(d.k));
  if(a==='addquick'){const q=QUICK[d.k];return addQ(newField(q[0],q[1],q[2]))}
  if(a==='sel'){S.sel=S.sel===d.id?null:d.id;return render()}
  if(a==='mv'){const i=f.fields.findIndex(x=>x.id===d.id),j=i+Number(d.d);[f.fields[i],f.fields[j]]=[f.fields[j],f.fields[i]];touch();return render()}
  if(a==='dupq'){const i=f.fields.findIndex(x=>x.id===d.id),c=JSON.parse(JSON.stringify(f.fields[i]));c.id=uid();f.fields.splice(i+1,0,c);S.sel=c.id;touch();render();return toast('已複製這一題')}
  if(a==='rmq'){const i=f.fields.findIndex(x=>x.id===d.id),x=f.fields.splice(i,1)[0];S.sel=null;touch();render();return toast('已刪除這一題','復原',()=>{f.fields.splice(i,0,x);S.sel=x.id;touch();render()})}
  if(a==='addopt'){f.fields.find(x=>x.id===S.sel).options.push('新選項');touch();render();const o=document.querySelectorAll('[data-opt]');const l=o[o.length-1];if(l){l.focus();l.select()}return}
  if(a==='rmopt'){f.fields.find(x=>x.id===S.sel).options.splice(Number(d.k),1);touch();return render()}
  if(a==='fix'){const x=f.fields.find(q=>q.id===d.id);x.label=x.label.split(d.k).join(d.to);touch();render();return toast('已幫你改好了')}
  if(a==='publish'){
    if(!f.title.trim()){toast('請先回第 1 步,填寫表單名稱');return}
    if(!f.fields.length){toast('請先回第 2 步,加入至少一題');return}
    const w=warnCount(f);
    return dlg(`<h3>確定要發布嗎?</h3><p class="muted" style="margin-top:0">發布後,民眾就能在台北通找到這份表單。</p>
      <div class="card" style="background:var(--bg);padding:14px 18px;margin:12px 0"><b>${esc(f.title)}</b><div class="muted small">${f.fields.length} 題｜${f.deadline?'截止 '+f.deadline:'不設截止日'}｜${f.allowAssist?'開放協助辦理':'僅限本人填寫'}</div></div>
      ${w?`<div class="warn">${ic('lightbulb',20)}<span>還有 ${w} 題可以寫得更好懂。想先修改的話,按「先不要」。</span></div>`:`<div class="good">${ic('circle-check',20)}所有題目長輩都看得懂</div>`}
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-act="closedlg">先不要</button><button class="btn primary" data-act="pubok">${ic('send',18)}確定發布</button></div>`)}
  if(a==='pubok'){f.status='open';touch();return dlg(`<div style="text-align:center;padding:10px 0"><div class="empty" style="padding:0"><div class="ico" style="background:var(--ok-l);color:var(--ok)">${ic('circle-check',36)}</div></div><h3>發布成功!</h3><p class="muted">民眾現在可以在台北通找到「${esc(f.title)}」。<br>有人填寫後,可以到「看回覆」查看。</p>
     <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-act="home">回到我的表單</button><button class="btn primary" data-act="resp" data-id="${f.id}">${ic('inbox',18)}看回覆</button></div></div>`)}
  if(a==='close'){return dlg(`<h3>要結束收件嗎?</h3><p>結束後,民眾就不能再填寫這份表單。已經收到的回覆還是會保留。</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closedlg">先不要</button><button class="btn primary" data-act="closeok">${ic('lock',18)}結束收件</button></div>`)}
  if(a==='closeok'){f.status='closed';touch();closeDlg();render();return toast('已結束收件')}
  if(a==='size'){S.pvSize=d.k;return render()}
  if(a==='pvreset'){S.pv=0;ans={};return render()}
  if(a==='speak'){const x=f.fields[S.pv];return speak(x.label+'。'+(x.hint||'')+(x.options.length?'。選項有:'+x.options.join('、'):''))}
  if(a==='pvprev'){if(S.pv<f.fields.length)ans[f.fields[S.pv].id]=pvCollect();if(S.pv>0)S.pv--;return render()}
  if(a==='pvnext'){const x=f.fields[S.pv],v=pvCollect(),er=validate(x,v);if(er)return toast(er);ans[x.id]=v;S.pv++;return render()}
  if(a==='pvsubmit'){const r={_t:Date.now(),_by:'本人(試填)'};f.fields.forEach(x=>r[x.id]=Array.isArray(ans[x.id])?ans[x.id].join('、'):ans[x.id]);f.live=f.live||[];f.live.unshift(r);S.pv=0;ans={};save();render();return toast('試填已送出,可在「看回覆」看到這一筆')}
  if(a==='csv'){
    const rs=allResp(f),q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
    const lines=[['送出時間','誰填的',...f.fields.map(x=>x.label)].map(q).join(',')];
    rs.forEach(r=>lines.push([fmt(r._t),r._by,...f.fields.map(x=>maskVal(x,r[x.id]))].map(q).join(',')));
    const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a2.download=(f.title||'表單')+'_回覆資料.csv';a2.click();return toast('已下載');}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('qh')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
  const t=e.target,f=S.cur?form():null;if(!f)return;
  if(t.dataset.set){f[t.dataset.set]=t.type==='checkbox'?t.checked:t.value;touch();if(t.dataset.set==='title')renderTop();return}
  const x=f.fields.find(a=>a.id===S.sel);if(!x)return;
  if(t.dataset.p){x[t.dataset.p]=t.type==='checkbox'?t.checked:t.value;touch();if(t.dataset.p==='required'){const m=document.querySelector('.qcard.sel .qm');render()}else refreshLive();return}
  if(t.dataset.opt!==undefined){x.options[Number(t.dataset.opt)]=t.value;touch();refreshLive()}
});
/* 拖曳排序 */
let dragIdx=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.qcard');if(c){dragIdx=Number(c.dataset.idx);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.qcard');if(c&&dragIdx!==null){e.preventDefault();document.querySelectorAll('.dragover').forEach(n=>n.classList.remove('dragover'));c.classList.add('dragover')}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.qcard');if(c&&dragIdx!==null){e.preventDefault();const to=Number(c.dataset.idx),f=form(),[m]=f.fields.splice(dragIdx,1);f.fields.splice(to,0,m);dragIdx=null;touch();render()}});
document.addEventListener('dragend',()=>{dragIdx=null;document.querySelectorAll('.dragover').forEach(n=>n.classList.remove('dragover'))});

render();
</script>
</body>
</html>
