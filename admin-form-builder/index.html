<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台北通表單 承辦人後台</title>
<style>
/* 配色取自 TownPass 專案 lib/util/tp_colors.dart:primary / secondary / grayscale / red */
:root{
  color-scheme:light;
  --p50:#EDF8FA;--p100:#DBF1F5;--p200:#B4E2EA;--p300:#93D4DF;--p500:#5AB4C5;--p600:#468D9B;--p700:#356C77;--p800:#22474E;
  --blue:#4B8DBF;
  --grad:linear-gradient(90deg,#5AB4C5,#4B8DBF);
  --s400:#EDBB60;--s500:#F5BA4B;--s800:#74521B;--s900:#3C2B0B;--s50:#FDF8ED;--s100:#FCF2DF;
  --g50:#F1F3F4;--g100:#E3E7E9;--g200:#CAD1D5;--g300:#ADB8BE;--g400:#91A0A8;--g500:#738995;--g600:#5E6D76;--g700:#475259;--g800:#30383D;--g900:#171B1D;
  --red50:#FAEEEE;--red500:#D45251;--red600:#C2332F;
  --ok:#2E8B57;--ok-l:#E6F5EC;
  --bg:#EDF4F6; --card:#fff; --ink:var(--g900); --muted:var(--g600);
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.06);
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ===== 頂欄(同台北通 App 的漸層) ===== */
.appbar{background:var(--grad);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.appbar .r1{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:64px}
.hico{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;flex:none}
.hico:hover{background:rgba(255,255,255,.2)}
.hico:disabled{opacity:.4;cursor:default;background:transparent}
.ftitle{background:transparent;border:2px solid transparent;border-radius:8px;color:#fff;font-size:19px;font-weight:700;padding:4px 10px;min-width:0;width:min(420px,40vw);text-overflow:ellipsis}
.ftitle:hover{border-color:rgba(255,255,255,.5)}
.ftitle:focus{background:#fff;color:var(--ink);outline:none;border-color:#fff}
.ftitle::placeholder{color:rgba(255,255,255,.8)}
.savetxt{font-size:13.5px;opacity:.95;display:flex;gap:5px;align-items:center;white-space:nowrap}
.hbtn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 20px;border-radius:999px;border:2px solid #fff;background:#fff;color:var(--p700);font-weight:700;white-space:nowrap}
.hbtn:hover{background:var(--p50)}
.hbtn.amber{background:var(--s500);border-color:var(--s500);color:var(--s900)}
.hbtn.amber:hover{background:var(--s400);border-color:var(--s400)}
.hbtn.ghost{background:transparent;color:#fff}
.hbtn.ghost:hover{background:rgba(255,255,255,.18)}
.tabs{display:flex;justify-content:center;gap:4px}
.tabs button{background:none;border:0;color:rgba(255,255,255,.88);font-weight:700;padding:12px 26px;border-bottom:4px solid transparent;font-size:16px;display:flex;gap:8px;align-items:center}
.tabs button:hover{background:rgba(255,255,255,.12)}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:#fff}
.tabs .cnt{background:rgba(255,255,255,.28);border-radius:99px;padding:0 9px;font-size:13px}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:0 16px;min-height:44px;flex:1;max-width:620px}
.searchbox input{border:0!important;background:transparent;flex:1;outline:none;min-width:0;box-shadow:none!important;padding:0!important;min-height:0!important}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:19px;background:none;border:0;color:#fff;padding:0 6px}
.logo i{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--p600);display:grid;place-items:center}
@media (max-width:760px){.logo span{display:none}.ftitle{width:34vw}.hbtn .tx{display:none}.hbtn{padding:0 12px}.savetxt{display:none}.tabs button{padding:10px 14px}}
/* ===== 通用元件 ===== */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--p600);background:#fff;color:var(--p600);font-weight:700;white-space:nowrap}
.btn:hover{background:var(--p50)}
.btn.primary{background:var(--p600);color:#fff}
.btn.primary:hover{background:var(--p700)}
.btn.alarm{background:var(--red500);border-color:var(--red500);color:#fff}.btn.alarm:hover{background:var(--red600)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--g600);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--g50);color:var(--ink)}
.iconbtn.dg:hover{background:var(--red50);color:var(--red600)}
.iconbtn:disabled{opacity:.35;cursor:default}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
.tag{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.tag.draft{background:var(--g100);color:var(--g700)}.tag.open{background:var(--ok-l);color:#1d6b40}.tag.closed{background:var(--red50);color:var(--red600)}
.switch{display:inline-flex;gap:12px;align-items:center;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:44px;height:24px;border-radius:99px;background:var(--g300);position:relative;flex:none;transition:.15s}
.switch .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+.sw{background:var(--p600)}.switch input:checked+.sw::after{left:23px}
.switch input:focus-visible+.sw{outline:3px solid var(--blue);outline-offset:2px}
input[type=text],input[type=date],input[type=tel],input[type=number],textarea,select{width:100%;border:1.5px solid var(--g200);border-radius:8px;padding:10px 12px;background:#fff;min-height:44px}
input:focus,textarea:focus,select:focus{border-color:var(--p600);outline:none;box-shadow:0 0 0 3px var(--p100)}
.lb{display:block;font-weight:700;margin:0 0 6px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .ico{width:72px;height:72px;border-radius:50%;background:var(--p100);color:var(--p600);display:grid;place-items:center;margin:0 auto 14px}
/* ===== 首頁 ===== */
.band{background:#fff;border-bottom:1px solid var(--g100)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.band .wrap{padding-top:18px;padding-bottom:22px}
.band h2{font-size:15px;font-weight:700;color:var(--g700);margin-bottom:12px}
.tplrow{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 8px}
.tplc{width:172px;flex:none;background:none;border:0;padding:0;text-align:left}
.tplc .th{height:112px;border-radius:10px;border:1.5px solid var(--g200);background:var(--p50);display:grid;place-items:center;color:var(--p600);transition:.12s}
.tplc:hover .th,.tplc:focus-visible .th{border-color:var(--p600);box-shadow:0 0 0 3px var(--p100)}
.tplc b{display:block;margin-top:8px;font-size:15px;line-height:1.35}
.tplc span{font-size:13px;color:var(--muted);line-height:1.35;display:block}
.homehead{display:flex;align-items:center;gap:10px;margin:22px 0 14px;flex-wrap:wrap}
.homehead h2{font-size:17px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1.5px solid var(--g200);background:#fff;border-radius:99px;padding:3px 14px;min-height:34px;font-weight:700;color:var(--g700);font-size:14.5px}
.pills button[aria-pressed=true]{background:var(--p600);border-color:var(--p600);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:110px}
.fc{position:relative;border:1.5px solid transparent;cursor:pointer}
.fc:hover{border-color:var(--p300)}
.fc .th{height:128px;background:var(--p50);padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--g100);border-radius:12px 12px 0 0}
.fc .th i{display:block;height:8px;border-radius:4px;background:var(--p200)}
.fc .th i.t{height:12px;width:62%;background:var(--p500)}
.fc .bd{padding:12px 14px 12px 16px;display:flex;gap:6px;align-items:flex-start}
.fc .nm{font-weight:700;line-height:1.4;display:block;word-break:break-word}
.fc .mt{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fc .more{margin:-4px -6px 0 0}
.pop{position:absolute;z-index:50;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:6px 0;min-width:180px}
.pop button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:10px 16px;text-align:left;font-size:15px;min-height:44px}
.pop button:hover,.pop button[aria-selected=true]{background:var(--p50)}
.pop button.dg{color:var(--red600)}
.fab{position:fixed;right:28px;bottom:28px;height:60px;padding:0 24px 0 18px;border-radius:30px;border:0;background:var(--s500);color:var(--s900);font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:30}
.fab:hover{background:var(--s400)}
.tip{display:flex;gap:12px;align-items:center;background:var(--s100);color:var(--s800);border-radius:12px;padding:12px 16px;margin-top:20px}
/* ===== 編輯器 ===== */
.ed{max-width:800px;margin:0 auto;padding:20px 16px 160px;position:relative}
.hcard{border-top:10px solid var(--p500);padding:22px 24px 20px;margin-bottom:14px}
.hcard .tt{width:100%;border:0;border-bottom:1.5px solid transparent;background:transparent;font-size:30px;font-weight:700;padding:4px 0;line-height:1.3;border-radius:0;min-height:0}
.hcard .tt:hover{border-bottom-color:var(--g200)}.hcard .tt:focus{border-bottom:2px solid var(--p600);box-shadow:none}
.hcard .ds{border:0;border-bottom:1.5px solid transparent;border-radius:0;padding:6px 0;resize:none;min-height:0;box-shadow:none!important;color:var(--g700)}
.hcard .ds:hover{border-bottom-color:var(--g200)}.hcard .ds:focus{border-bottom:2px solid var(--p600)}
.qc{position:relative;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:12px;border-left:6px solid transparent;cursor:pointer}
.qc.dragover{outline:3px dashed var(--p500)}
.qc.act{border-left-color:var(--p600);cursor:default;padding-top:30px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
.qc .grab{position:absolute;top:4px;left:50%;transform:translateX(-50%);color:var(--g300);cursor:grab;display:none}
.qc.act .grab,.qc:hover .grab{display:block}
.qv .q{font-size:17px;font-weight:600;line-height:1.5}.qv .q .rq{color:var(--red600)}
.qv .h{font-size:14px;color:var(--muted);margin-top:2px}
.qv .m{margin-top:14px;color:var(--g500);display:flex;flex-direction:column;gap:10px}
.qv .m div{display:flex;gap:12px;align-items:center}
.ul{border-bottom:1.5px dotted var(--g300);padding:4px 0;width:60%;min-width:180px;color:var(--g500)}
.qtop{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.qtop .qin{flex:1;min-width:220px;background:var(--g50);border:0;border-bottom:2px solid var(--g300);border-radius:6px 6px 0 0;font-size:17px;padding:12px 14px;min-height:52px}
.qtop .qin:focus{border-bottom-color:var(--p600);box-shadow:none;background:var(--p50)}
.typewrap{position:relative;width:230px}
.typebtn{width:100%;display:flex;gap:10px;align-items:center;border:1.5px solid var(--g200);background:#fff;border-radius:8px;min-height:52px;padding:0 12px;font-weight:600}
.typewrap .pop{top:56px;left:0;right:0;max-height:380px;overflow:auto}
.hin{margin-top:8px;border:0;border-bottom:1.5px solid var(--g200);border-radius:0;padding:8px 2px;font-size:14.5px;min-height:0;box-shadow:none!important;color:var(--g700)}
.hin:focus{border-bottom:2px solid var(--p600)}
.opts{margin-top:14px}
.orow{display:flex;gap:10px;align-items:center;margin-bottom:2px}
.orow .oi{color:var(--g400);width:24px;text-align:center;flex:none}
.orow input{border:0;border-bottom:1.5px solid transparent;border-radius:0;padding:8px 2px;min-height:44px;box-shadow:none!important}
.orow input:hover{border-bottom-color:var(--g200)}.orow input:focus{border-bottom:2px solid var(--p600)}
.addopt{background:none;border:0;color:var(--g600);display:flex;gap:10px;align-items:center;padding:8px 0;min-height:44px;font-weight:600}
.addopt:hover{color:var(--p600)}
.qfoot{display:flex;gap:4px;align-items:center;border-top:1px solid var(--g100);margin-top:18px;padding-top:12px;justify-content:flex-end;flex-wrap:wrap}
.qfoot .dv{width:1px;height:28px;background:var(--g200);margin:0 12px}
.tips{margin-top:14px}
.tipc{background:var(--s50);border:1px solid var(--s100);color:var(--s800);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.tipc+.tipc{margin-top:8px}
.good{display:flex;gap:8px;align-items:center;color:#1d6b40;font-size:14px;font-weight:600}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--s100);color:var(--s800);border-radius:99px;padding:0 10px;font-size:12.5px;font-weight:700;margin-left:8px;vertical-align:middle}
.ftool{position:absolute;left:calc(100% + 14px);top:0;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:5}
.ftool .iconbtn{color:var(--g700)}
.ftool .pop{left:54px;top:0}
@media (max-width:1000px){.ftool{position:fixed;left:auto;right:16px;bottom:16px;top:auto;flex-direction:row;box-shadow:0 6px 18px rgba(0,0,0,.28);padding:6px 10px;z-index:35}.ftool .pop{left:auto;right:0;top:auto;bottom:54px}}
.firstq{padding:30px 20px;text-align:center}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chipbtn{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--g200);background:#fff;border-radius:99px;padding:0 16px;min-height:42px;font-weight:600}
.chipbtn:hover{border-color:var(--p600);background:var(--p50)}
/* 設定 */
.sc{padding:22px 24px;margin-bottom:14px}
.sc h3{font-size:18px;margin-bottom:4px}.sc .lead{color:var(--muted);margin-bottom:16px;font-size:14.5px}
.srow{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--g100)}
.srow .d{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
/* 回覆 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:16px 20px}.stat b{display:block;font-size:30px;line-height:1.2;color:var(--p700)}
.sub{display:flex;gap:4px;justify-content:center;margin-bottom:14px}
.sub button{border:0;background:none;padding:8px 22px;font-weight:700;color:var(--g600);border-radius:99px;min-height:40px}
.sub button[aria-selected=true]{background:var(--p100);color:var(--p700)}
.bar{display:flex;align-items:center;gap:12px;margin:8px 0}
.bar .nm{width:34%;min-width:110px;font-size:15px;word-break:break-word}
.bar .tr{flex:1;height:22px;background:var(--g50);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--p500);border-radius:6px}
.bar .v{width:96px;text-align:right;font-size:14px;color:var(--g700);white-space:nowrap}
.ans{background:var(--g50);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:15px}
.tablewrap{overflow:auto;max-height:64vh}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--g100);font-size:15px;white-space:nowrap}
th{background:#fff;position:sticky;top:0;color:var(--g600);font-size:14px}
/* ===== 預覽 / 手機 ===== */
.pvlayer{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.pvlayer .appbar{position:static}
.pvbody{flex:1;overflow:auto;padding:22px 16px;display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:100%;max-width:380px;border:9px solid var(--g800);border-radius:38px;background:#fff;color:var(--g900);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.phone .bar0{background:var(--grad);color:#fff;padding:16px;font-weight:800}
.phone .bd{padding:18px;min-height:540px;display:flex;flex-direction:column;gap:14px}
.prog{height:8px;background:var(--p100);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--p600)}
.qtx{font-weight:800;line-height:1.4}
.phint{background:var(--p50);border-radius:12px;padding:10px 12px;color:var(--p800);display:flex;gap:8px;align-items:flex-start}
.phone input[type=text],.phone input[type=date],.phone input[type=tel],.phone input[type=number],.phone textarea,.phone select{border:2px solid var(--g300);font-size:1em;padding:12px;border-radius:12px}
.choice{display:flex;gap:12px;align-items:center;border:2px solid var(--g300);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;font-size:1em}
.choice input{width:26px;height:26px;flex:none}
.pnav{margin-top:auto;display:flex;gap:10px}
.pnav button{flex:1;min-height:56px;border-radius:14px;border:2px solid var(--p600);font-weight:800;font-size:1em;background:#fff;color:var(--p700)}
.pnav button.p{background:var(--p600);color:#fff}.pnav button:disabled{opacity:.4}
.speak{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:2px solid var(--p600);border-radius:99px;background:#fff;color:var(--p700);padding:6px 16px;font-weight:800;font-size:.8em}
.seg{display:inline-flex}.seg button{border:1.5px solid var(--g300);background:#fff;padding:0 18px;min-height:42px;font-weight:700;margin-right:-1.5px}
.seg button:first-child{border-radius:99px 0 0 99px}.seg button:last-child{border-radius:0 99px 99px 0;margin-right:0}
.seg button[aria-pressed=true]{background:var(--p600);border-color:var(--p600);color:#fff}
/* 彈窗、提示 */
dialog{border:0;border-radius:16px;background:#fff;color:var(--ink);max-width:640px;width:94%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{font-size:21px;margin-bottom:6px}
.copybox{display:flex;gap:8px;background:var(--g50);border-radius:10px;padding:6px 6px 6px 14px;align-items:center;margin:12px 0}
.copybox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.toast{position:fixed;bottom:28px;left:24px;background:var(--g800);color:#fff;padding:8px 8px 8px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:100;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:var(--p300);font-weight:800;padding:8px 14px;min-height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

/>", "x": "<path d=\"M18 6 6 18\" /> <path d=\"m6 6 12 12\" />"};  /* 圖示來自 Lucide (https://lucide.dev),ISC 授權 */

const TEMPLATES={

    fields:[mk('text','你的姓名','請填身分證上的名字'),mk('idno','你的身分證字號','英文字母加 9 個數字'),mk('date','你的出生日期'),mk('phone','你的聯絡電話','方便我們打給你確認'),mk('address','你住在哪裡','請填目前的住址'),mk('radio','錢要怎麼給你','',true,['匯到我的銀行帳戶','到區公所領現金']),mk('text','銀行名稱與分行','有郵局或銀行存摺的話,照著存摺上寫',false),mk('consent','我保證上面寫的都是真的')]})},
  repair:{n:'路燈與道路損壞通報',d:'工務局範例',ic:'map-pin',make:()=>({title:'路燈與道路損壞通報',dept:'臺北市政府工務局',desc:'發現路燈不亮或馬路破洞,請在這裡告訴我們。',
    fields:[mk('radio','哪裡壞了','',true,['路燈不亮','馬路有洞','人行道破損','其他']),mk('address','在哪個位置','寫路名和附近的店家也可以'),mk('file','拍張照片給我們','沒有照片也可以',false),mk('phone','你的電話','處理好之後通知你',false)]})},
  survey:{n:'活動報名',d:'通用範例',ic:'clipboard-list',make:()=>({title:'市民活動報名',dept:'臺北市政府',desc:'歡迎報名參加,名額有限,請盡早填寫。',

const mkForm=(t,extra={})=>({id:uid(),...t,deadline:'',allowAssist:true,once:false,doneMsg:'已經幫你送出了,謝謝你。',status:'draft',updated:Date.now(),...extra});

/* ===== 狀態 ===== */
let S=load()||seed();
function seed(){const a=TEMPLATES.elder.make(),b=TEMPLATES.repair.make();
  return {forms:[mkForm(a,{deadline:'2026-12-31',status:'open',updated:Date.now()-86400000*2}),mkForm(b,{allowAssist:false,updated:Date.now()-3600000*5})],
    view:'home',cur:null,tab:'q',rsub:'sum',sel:null,hideTip:false,filter:'all',q:'',menu:null,pv:null};}
function load(){try{const s=JSON.parse(localStorage.getItem('tpf-admin-v3'));if(s){Object.assign(s,{view:'home',cur:null,menu:null,pv:null,sel:null,tab:'q'});}return s}catch(e){return null}}
function save(){try{localStorage.setItem('tpf-admin-v3',JSON.stringify(S))}catch(e){}}
const form=()=>S.forms.find(f=>f.id===S.cur);
const fmt=ts=>new Date(ts).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const stName={draft:'草稿',open:'收件中',closed:'已停止收件'};
const stIc={draft:'pencil',open:'circle-check',closed:'lock'};
let tt;function toast(m,label,fn){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${label?`<button id="tact">${esc(label)}</button>`:''}`;t.classList.add('show');if(label)$('#tact').onclick=()=>{fn();t.classList.remove('show')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),label?7000:2800);}

/* ===== 復原 / 重做 ===== */
const H={};let snapT;
const pick=f=>{const {live,id,updated,...r}=f;return JSON.stringify(r)};
function hist(){const f=form();return H[f.id]||(H[f.id]={st:[pick(f)],i:0})}
function snap(){clearTimeout(snapT);const f=form();if(!f)return;const h=hist(),j=pick(f);if(h.st[h.i]===j)return;h.st=h.st.slice(0,h.i+1);h.st.push(j);h.i++;if(h.st.length>80){h.st.shift();h.i--}updHist()}
function touch(now){const f=form();f.updated=Date.now();save();const s=$('#savetxt');if(s)s.innerHTML=`${ic('circle-check',16)}已儲存`;clearTimeout(snapT);if(now)snap();else snapT=setTimeout(snap,500)}
function updHist(){const h=hist(),u=$('#undo'),r=$('#redo');if(u)u.disabled=h.i<=0;if(r)r.disabled=h.i>=h.st.length-1}
function applyHist(d){snap();const h=hist(),n=h.i+d;if(n<0||n>=h.st.length)return;h.i=n;const f=form(),o=JSON.parse(h.st[n]);Object.keys(f).forEach(k=>{if(!['id','updated','live'].includes(k))delete f[k]});Object.assign(f,o);if(!f.fields.find(x=>x.id===S.sel))S.sel=null;save();render()}

/* ===== 好懂檢查 ===== */
function readability(f){
  const w=[],t=f.label||'';
  if(t.length>20)w.push({msg:'問題有點長(超過 20 個字),長輩可能看不完。可以縮短,或拆成兩題。'});
  for(const k in JARGON)if(t.includes(k)){const to=JARGON[k];w.push({msg:`「${k}」是公文用語,建議改成日常說法${to?`,例如「${to}」`:''}。`,fix:to?{k,to}:null})}
  if(/[A-Za-z]{3,}/.test(t)&&f.type!=='idno')w.push({msg:'盡量不要用英文縮寫,長輩看不懂。'});
  if(['idno','address','file','date'].includes(f.type)&&!f.hint)w.push({msg:'建議在下面的「說明文字」寫一句話,告訴民眾要填什麼、去哪裡找。'});
  if(OPT.includes(f.type)&&f.options.length>6)w.push({msg:'選項超過 6 個,不容易選。可以精簡一下。'});
  return w;
}

/* ---- 回覆 ---- */
function respCount(f){return allResp(f).length}
function rng(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function mockResp(f){
  if(f.status==='draft')return [];
  const r=rng(f.id),names=['陳美玲','林建國','黃秀英','張志明','李淑芬','王大明','吳金龍','蔡玉蘭'],by=['本人','家屬協助','里長協助','看護協助','1999 客服協助'],out=[];
  for(let i=0;i<(f.status==='closed'?18:24);i++){
    const row={_t:Date.now()-Math.floor(r()*86400000*6),_by:by[Math.floor(r()*by.length)]};
    f.fields.forEach(x=>{const o=x.options||[];
      if(x.type==='idno')row[x.id]='A'+(Math.floor(r()*2)+1)+String(Math.floor(r()*1e8)).padStart(8,'0');
      else if(x.type==='phone')row[x.id]='09'+String(Math.floor(r()*1e8)).padStart(8,'0');
      else if(x.type==='radio'||x.type==='select')row[x.id]=o[Math.floor(r()*r()*o.length)]||'';
      else if(x.type==='checkbox')row[x.id]=o.filter(()=>r()>.55).join('、');
      else if(x.type==='date')row[x.id]='19'+(30+Math.floor(r()*30))+'-0'+(1+Math.floor(r()*9))+'-1'+Math.floor(r()*9);
      else if(x.type==='consent')row[x.id]='已同意';
      else if(x.type==='file')row[x.id]='照片'+(i+1)+'.jpg';
      else if(x.type==='address')row[x.id]='臺北市'+['大安','信義','中正','萬華','北投'][Math.floor(r()*5)]+'區○○路'+Math.floor(r()*200)+'號';
      else if(x.type==='number')row[x.id]=1+Math.floor(r()*4);
      else if(x.label.includes('姓名'))row[x.id]=names[Math.floor(r()*names.length)];
      else row[x.id]='(示意回答)';});
    out.push(row);}
  return out;
}
const allResp=f=>[...(f.live||[]),...mockResp(f)].sort((a,b)=>b._t-a._t);
const maskVal=(x,v)=>x.type==='idno'&&v?String(v).slice(0,3)+'●●●●'+String(v).slice(-3):x.type==='phone'&&v?String(v).slice(0,4)+'●●●'+String(v).slice(-3):v;
function tabR(f){
  const rs=allResp(f),assist=rs.filter(r=>!r._by.startsWith('本人')).length;
  const head=`<div class="ed" style="max-width:900px"><div class="card sc" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div><h3 style="margin:0">${rs.length} 份回覆</h3><span class="muted small">目前是示意資料。身分證字號與電話只顯示一部分。</span></div><span class="sp"></span>
    <label class="switch"><span>接受回覆</span><input type="checkbox" data-act="accept" ${f.status==='open'?'checked':''} ${f.status==='draft'?'disabled':''}><span class="sw"></span></label>
    <button class="btn primary" data-act="csv" ${rs.length?'':'disabled'}>${ic('download',20)}下載成 Excel 檔</button></div>`;
  if(!rs.length)return head+`<div class="card empty"><div class="ico">${ic('inbox',34)}</div><b>還沒有人填寫</b><p>${f.status==='draft'?'表單發布後,民眾的回覆會顯示在這裡。':'等待民眾填寫中。'}</p></div></div>`;
  const sub=`<div class="sub" role="tablist"><button role="tab" aria-selected="${S.rsub==='sum'}" data-act="rsub" data-k="sum">摘要</button><button role="tab" aria-selected="${S.rsub==='list'}" data-act="rsub" data-k="list">全部回覆</button></div>`;
  if(S.rsub==='list')return head+sub+`<div class="card tablewrap"><table><thead><tr><th>送出時間</th><th>誰填的</th>${f.fields.map(x=>`<th>${esc(x.label)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr><td>${fmt(r._t)}</td><td>${esc(r._by)}</td>${f.fields.map(x=>`<td>${esc(maskVal(x,r[x.id])??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  const stats=`<div class="stats"><div class="card stat"><span class="muted">全部回覆</span><b>${rs.length}</b></div><div class="card stat"><span class="muted">別人協助填寫</span><b>${assist}</b></div><div class="card stat"><span class="muted">本人填寫</span><b>${rs.length-assist}</b></div></div>`;
  const by={};rs.forEach(r=>by[r._by]=(by[r._by]||0)+1);
  const mx=Math.max(...Object.values(by));
  const who=`<div class="card sc"><h3>誰填的</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span class="nm">${esc(k)}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><span class="v">${v} 份(${Math.round(v/rs.length*100)}%)</span></div>`).join('')}</div>`;
  const cards=f.fields.map(x=>{
    const vals=rs.map(r=>r[x.id]).filter(v=>v!==undefined&&v!=='');
    let body;
    if(OPT.includes(x.type)){const c={};x.options.forEach(o=>c[o]=0);vals.forEach(v=>String(v).split('、').forEach(p=>{if(p in c)c[p]++}));const m=Math.max(1,...Object.values(c));
      body=Object.entries(c).map(([k,v])=>`<div class="bar"><span class="nm">${esc(k)}</span><span class="tr"><i style="width:${v/m*100}%"></i></span><span class="v">${v} 份(${Math.round(v/Math.max(1,vals.length)*100)}%)</span></div>`).join('');}
    else body=vals.slice(0,5).map(v=>`<div class="ans">${esc(maskVal(x,v))}</div>`).join('')+(vals.length>5?`<div class="muted small" style="margin-top:6px">還有 ${vals.length-5} 筆,請到「全部回覆」查看</div>`:'');
    return `<div class="card sc"><h3 style="font-size:17px">${esc(x.label)}</h3><div class="muted small" style="margin-bottom:8px">${vals.length} 個回覆</div>${body}</div>`}).join('');
  return head+sub+stats+who+cards+'</div>';
}

let ans={};
const SIZES={m:'18px',l:'22px',xl:'28px'};
function pvInput(x){
  const v=ans[x.id],o=x.options||[];
  switch(x.type){
    case 'radio':return o.map(t=>`<label class="choice"><input type="radio" name="pv" value="${esc(t)}" ${v===t?'checked':''}>${esc(t)}</label>`).join('');
    case 'checkbox':return o.map(t=>`<label class="choice"><input type="checkbox" name="pv" value="${esc(t)}" ${(v||[]).includes(t)?'checked':''}>${esc(t)}</label>`).join('');
    case 'select':return `<select id="pvin"><option value="">請選擇</option>${o.map(t=>`<option ${v===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
    case 'textarea':return `<textarea id="pvin" rows="4">${esc(v||'')}</textarea>`;
    case 'consent':return `<label class="choice"><input type="checkbox" id="pvin" ${v?'checked':''}>${esc(x.label)}</label>`;
    case 'file':return `<input type="file" id="pvin">`;
    case 'date':return `<input type="date" id="pvin" value="${esc(v||'')}">`;
    case 'number':return `<input type="number" inputmode="numeric" id="pvin" value="${esc(v||'')}">`;
    case 'phone':return `<input type="tel" inputmode="tel" id="pvin" value="${esc(v||'')}" placeholder="0912-345-678">`;
    case 'idno':return `<input type="text" id="pvin" maxlength="10" value="${esc(v||'')}" placeholder="A123456789" autocapitalize="characters">`;
    default:return `<input type="text" id="pvin" value="${esc(v||'')}">`;
  }
}
function summary(x,v){if(x.type==='idno'&&v)return v.slice(0,3)+'●●●●'+v.slice(-3);if(Array.isArray(v))return v.join('、')||'(沒有填)';if(x.type==='consent')return v?'已同意':'(沒有勾選)';return v||'(沒有填)'}
function vPreview(){

  else if(P.i>=n)body=`<div class="bd" style="font-size:${sz}"><div class="qtx" style="font-size:1.25em">請最後確認</div>${f.fields.map(x=>`<div class="phint" style="display:block"><b>${esc(x.label)}</b><br>${esc(summary(x,ans[x.id]))}</div>`).join('')}<div class="pnav"><button data-act="pvprev">回上一題</button><button class="p" data-act="pvsubmit">確認送出</button></div></div>`;
  else{const x=f.fields[P.i];body=`<div class="bd" style="font-size:${sz}">${P.i===0&&f.desc?`<div class="phint">${ic('info',20)}<span>${esc(f.desc)}</span></div>`:''}
    <div class="prog"><i style="width:${(P.i+1)/n*100}%"></i></div><div style="color:var(--g600);font-size:.8em">第 ${P.i+1} 題,共 ${n} 題</div>
    <div class="qtx" style="font-size:1.2em">${esc(x.label)}${x.required?'':' <span style="font-weight:500;font-size:.65em;color:var(--g600)">(可以不填)</span>'}</div>
    ${x.hint?`<div class="phint">${ic('lightbulb',20)}<span>${esc(x.hint)}</span></div>`:''}
    <button class="speak" data-act="speak">${ic('volume-2',20)}念給我聽</button><div>${pvInput(x)}</div>
    <div class="pnav"><button data-act="pvprev" ${P.i===0?'disabled':''}>回上一題</button><button class="p" data-act="pvnext">下一題</button></div></div>`}
  return `<div class="pvlayer" role="dialog" aria-label="預覽"><header class="appbar"><div class="r1"><button class="hico" data-act="pvclose" aria-label="關閉預覽">${ic('x',24)}</button><b style="font-size:18px">預覽</b><span style="opacity:.9" class="small">民眾在台北通看到的樣子,可以實際填填看</span><span class="sp"></span></div></header>
   <div class="pvbody"><div class="phone"><div class="bar0">${esc(f.title||'未命名表單')}</div>${body}</div>
   <div class="card sc" style="max-width:300px"><h3 style="font-size:17px;margin-bottom:10px">字體大小</h3><div class="seg" role="group" aria-label="字體大小">${[['m','中'],['l','大'],['xl','特大']].map(([k,t])=>`<button data-act="size" data-k="${k}" aria-pressed="${P.size===k}">${t}</button>`).join('')}</div>
   <p class="muted small" style="margin-top:12px">長輩可以放大字體並使用朗讀。試填的資料不會真的送出。</p><div style="margin-top:12px"><button class="btn sm" data-act="pvreset">${ic('rotate-ccw',18)}重新開始</button></div></div></div></div>`;
}
function pvCollect(){
  const x=form().fields[S.pv.i];if(!x)return null;
  if(x.type==='radio'){const c=document.querySelector('input[name=pv]:checked');return c?c.value:''}
  if(x.type==='checkbox')return [...document.querySelectorAll('input[name=pv]:checked')].map(i=>i.value);
  if(x.type==='consent')return $('#pvin').checked;
  if(x.type==='file'){const i=$('#pvin');return i.files[0]?i.files[0].name:''}
  return $('#pvin').value.trim();
}
function validate(x,v){
  const empty=v===''||v===false||(Array.isArray(v)&&!v.length);
  if(empty)return x.required?'這題要填喔,請回答後再按「下一題」':'';
  if(x.type==='idno'&&!/^[A-Z][12489]\d{8}$/.test(v.toUpperCase()))return '身分證字號格式不對,應該是 1 個英文字母加 9 個數字';
  if(x.type==='phone'&&!/^(09\d{2}-?\d{3}-?\d{3}|0\d{1,2}-?\d{6,8})$/.test(v.replace(/\s/g,'')))return '電話號碼格式不對,請再檢查一次';
  return '';
}
function speak(t){if(!('speechSynthesis' in window)){toast('這個裝置不支援朗讀');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u)}

  if(a==='delok'){S.forms=S.forms.filter(x=>x.id!==d.id);closeDlg();go({view:'home',cur:null});return toast('已刪除表單')}
  if(a==='tab'){S.tab=d.k;S.menu=null;render();return window.scrollTo(0,0)}

  if(a==='undo')return applyHist(-1);

  if(a==='preview'){ans={};S.pv={i:0,size:'l',done:false};return render()}
  if(a==='pvclose'){S.pv=null;return render()}
  if(a==='size'){S.pv.size=d.k;return render()}

  if(a==='rmq'){const i=f.fields.findIndex(x=>x.id===S.sel),x=f.fields.splice(i,1)[0];S.sel=f.fields[Math.min(i,f.fields.length-1)]?.id||null;touch(true);render();return toast('已刪除這一題','復原',()=>{f.fields.splice(i,0,x);S.sel=x.id;touch(true);render()})}

  const f=S.cur?form():null;if(!f)return;
  if(t.dataset.set){f[t.dataset.set]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.set==='title'){const o=t.id==='ttl'?$('#ftitle'):$('#ttl');if(o)o.value=t.value}touch();return}
  const x=f.fields.find(a=>a.id===S.sel);if(!x)return;
  if(t.dataset.p){x[t.dataset.p]=t.type==='checkbox'?t.checked:t.value;touch(t.type==='checkbox');if(t.dataset.p==='required')return render();refreshLive();return}
  if(t.dataset.opt!==undefined){x.options[Number(t.dataset.opt)]=t.value;touch();refreshLive()}
});
/* 拖曳排序 */
let dragIdx=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.qc');if(c){dragIdx=Number(c.dataset.idx);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.qc');if(c&&dragIdx!==null){e.preventDefault();document.querySelectorAll('.dragover').forEach(n=>n.classList.remove('dragover'));c.classList.add('dragover')}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.qc');if(c&&dragIdx!==null){e.preventDefault();const to=Number(c.dataset.idx),f=form(),[m]=f.fields.splice(dragIdx,1);f.fields.splice(to,0,m);S.sel=m.id;dragIdx=null;touch(true);render()}});
document.addEventListener('dragend',()=>{dragIdx=null;document.querySelectorAll('.dragover').forEach(n=>n.classList.remove('dragover'))});

render();
</script>
</body>
</html>
